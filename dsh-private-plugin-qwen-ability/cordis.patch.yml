# dsh-private-plugin-qwen-ability's own patch layer, applied by the profile once this
# package is installed as a profile dependency.
#
# A preset is a COMPLETE capability tree, not a patch on another one: choosing
# it replaces the selected preset's tree, so this row restates the standard
# capability set (mirroring the official declaration, as the zCode preset
# does) and adds the Qwen Code components to it. Only the `qwen-*` entries
# are this package's own.
#
# Two rows: the Qwen OAuth account (dsh-private-plugin-qwen-account) and the
# Qwen Code agent preset (dsh-private-plugin-qwen-environment) — both nested
# component packages of this container.
#
# The account row sits OUTSIDE the preset on purpose. An account is
# install-level, so it must survive a preset switch; a preset row would take
# the account with it.
- insert:
    - id: qwen-account-external
      name: 'dsh-private-plugin-qwen-account'
      config: {}
- insert:
    - id: qwen-code-preset
      name: 'dsh-private-plugin-qwen-environment'
      # Flip to `disabled: true` to ship the preset installed but not enabled.
      disabled: false
      config:
        id: qwen-code
        name: Qwen Code
        description: Qwen Code 工作方式。标准能力 + Qwen Code 的会话内能力（移植系统提示词 / loop 定时器与四工具 / 移植技能树）
        order: -9
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: You are Qwen Code, a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          # --- Qwen Code: the ported core-mandates posture (a section, never a complete prompt) ---
          - id: qwen-persona
            name: 'dsh-private-plugin-qwen-persona'
            inject: [systemPrompt]
            config: {}
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          # The ported skill tree: harness ships its own skills (bundled,
          # user, project), so only the Qwen Code-derived ones are added here
          # as an extra root. The shipped `skills/` directory holds the ported
          # loop skill (see README).
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              # Container-relative: the environment component resolves
              # non-absolute entries against the container root at register
              # time (YAML has no module anchor), so this stays device-portable.
              customSkillDirs:
                - skills
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          # --- Qwen Code: the loop scheduler and its four tools ---
          - id: qwen-loop
            name: 'dsh-private-plugin-qwen-loop'
            inject: [tools]
            config: {}
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
