# dsh-private-plugin-codex-ability's own patch layer, applied by the profile once this
# package is installed as a profile dependency.
#
# A preset is a COMPLETE capability tree, not a patch on another one: choosing
# it replaces the selected preset's tree, so this row restates the standard
# capability set (mirroring the official declaration, as the zCode and Qwen
# presets do) and adds the Codex components to it. Only the `codex-*` entries
# are this package's own.
#
# Two rows: the Codex account (dsh-private-plugin-codex-account) and the
# Codex agent preset (dsh-private-plugin-codex-environment) — both nested
# component packages of this container.
#
# The account row sits OUTSIDE the preset on purpose. An account is
# install-level, so it must survive a preset switch; a preset row would take
# the account with it.
- insert:
    - id: codex-account-external
      name: 'dsh-private-plugin-codex-account'
      config: {}
- insert:
    - id: codex-preset
      name: 'dsh-private-plugin-codex-environment'
      # Flip to `disabled: true` to ship the preset installed but not enabled.
      disabled: false
      config:
        id: codex
        name: Codex
        description: Codex 工作方式。标准能力 + Codex 的会话内能力（移植系统提示词 / loop 定时器与四工具 / 移植技能树）
        order: -8
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: You are Codex, a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          # --- Codex: the ported posture (a section, never a complete prompt) ---
          - id: codex-persona
            name: 'dsh-private-plugin-codex-persona'
            inject: [systemPrompt]
            config: {}
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          # The ported skill tree: harness ships its own skills (bundled,
          # user, project), so only the Codex-derived ones are added here
          # as an extra root. The shipped `skills/` directory holds the ported
          # loop skill (see README).
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              # Container-relative: the environment component resolves
              # non-absolute entries against the container root at register
              # time (YAML has no module anchor), so this stays device-portable.
              customSkillDirs:
                - skills
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          # --- Codex: the loop scheduler and its four tools ---
          - id: codex-loop
            name: 'dsh-private-plugin-codex-loop'
            inject: [tools]
            config: {}
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
