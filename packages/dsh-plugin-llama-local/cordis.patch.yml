# The local GGUF account plugin's own patch layer, applied by the profile once
# this package is installed as a profile dependency. The bare name resolves
# through the package's `main` (dist/index.js), so rebuild dist after editing
# src. Nothing here touches harness sources: the plugin ships its own runtime
# dependencies (`node_modules/`) and its own weights (`models/`), both located
# at run time from `import.meta.url`, so no environment variable or cwd
# assumption leaks in.
- insert:
    - id: local-llama-account
      name: 'dsh-plugin-llama-local'
      # A config-less activation: every knob lives in the model module, the
      # account card exposes nothing to edit. An empty object keeps the
      # schemastery Config valid where `undefined` would fail validation.
      config: {}
