# dsh-plugin-digital-hands's own patch layer, applied by the profile once this
# package is installed as a profile dependency.
#
# Digital Hands is an INSTALL-LEVEL component, deliberately mounted OUTSIDE any
# agent preset (the same shape qwen-account-external uses): a managed tool
# catalog is install-wide, so it must survive preset switches. The `tools`
# service injection makes its registrations visible to every session; agent
# presets that want a *different* catalog can instead move this row into their
# `plugins` list with a `config.plan` referencing a named plan — the component
# reads its plan source from config either way.
#
# config.plan (optional): load a single named plan from
#   $DSH_HOME/digital-hands/plans/<plan>.yml
# With no config at all, `default.yml` in that directory is loaded when it
# exists; otherwise the component mounts with tool_search only (an empty
# catalog — still useful for enumerating natively mounted tools).
- insert:
    - id: digital-hands
      name: 'dsh-plugin-digital-hands'
      inject: [tools]
      disabled: false
      config: {}
    # Client-side remote mount: registers the `digitalHands` typert namespace
    # as early as the remote carrier exists, so the settings section resolves
    # it during its own activation.
    - id: dh-mount
      name: '@dsh/dh-mount'
      disabled: false
    # The settings section UI (tool catalog / MCP management / plan editor).
    - id: dh-ui
      name: '@dsh/dh-ui'
      disabled: false
