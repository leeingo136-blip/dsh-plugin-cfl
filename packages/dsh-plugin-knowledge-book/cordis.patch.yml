# 知识书容器：三个全新组件行，无条件插入。
# - knowledge-api：宿主服务（技能文件管理 + sqlite-vec 知识库）与 knowledge 远程面
# - knowledge-mount：client 面独立挂载组件（只挂 knowledge 远程贡献，inject ['remote']；
#   与官方 account-hub-mount 同构——挂载与消费分离，消费方注入 remote.knowledge 命名空间
#   服务以 park 到挂载完成）
# - ui-knowledge-book：设置中新增「技能」「知识库」两栏（settings.section 槽位）
# 本容器不 retarget 任何官方行。
- insert:
    - id: knowledge-api
      name: '@dsh/api-knowledge-book'
    - id: knowledge-mount
      name: '@dsh/knowledge-mount'
    - id: ui-knowledge-book
      name: '@dsh/ui-knowledge-book'
