# Unified account hub（保留官方账号宿主版）。
#
# 与旧版的关键区别：
# - 不再禁用官方 DeepSeek 账号插件（ui-settings-account / deepseek-account /
#   account-controller / llm-deepseek / llm-deepseek-account 全部保持启用）；
#   官方继续负责登录、令牌、remote.account 与 welcome 判断。
# - 不再插入 account-desktop-shim 伪装登录态，主页欢迎界面由官方真实状态决定。
# - 模型页由本容器接管：@dsh/ui-settings-models 为旧 hub 模型页移植到 rc3，
#   保留我们给其他插件新增的模型位接口（provider-card owner / editor / zone /
#   footer）；DeepSeek 账号模型卡片继续由官方账号 provider 数据驱动。
# - 账号页由 hub 接管：官方账号页 UI 禁用，hub 绘制 DeepSeek 官方账号卡片
#   （数据来自 remote.account）与第三方账号卡片。
# 只禁用官方账号页 UI：官方宿主（deepseek-account / account-controller /
# llm-deepseek）保持启用，welcome 与登录令牌仍走官方；账号页由 hub 绘制。
- id: ui-settings-account
  disabled: true

- id: ui-settings-models
  disabled: true

# 删除官方默认的「DeepSeek API」（API Key）模型卡片；账号卡片
# （llm-deepseek-account / deepseek-official）保留。
- id: llm-deepseek
  disabled: true

- insert:
    - id: account-hub
      name: '@dsh/api-account-hub'
    - id: account-hub-mount
      name: '@dsh/account-hub-mount'
    - id: ui-account-hub
      name: '@dsh/ui-account-hub'
    - id: ui-settings-models-ext
      name: '@dsh/ui-settings-models'
