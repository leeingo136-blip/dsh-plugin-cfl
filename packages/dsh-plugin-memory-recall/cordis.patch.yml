# 记忆回想容器：四个全新组件行，无条件插入。
# - memory-api：宿主服务（RAG 连接卡片注册表）与 memory-recall 远程面
# - memory-mount：client 面独立挂载组件（只挂 memory-recall 远程贡献，inject ['remote']；
#   与官方 account-hub-mount 同构——挂载与消费分离，消费方注入 remote.memory-recall 命名空间
#   服务以 park 到挂载完成）
# - ui-memory-recall：设置中新增「记忆回想」一栏（settings.section 槽位）
# - memory-recall-tools：六工具组件（knowledge_add/search/delete、memory_recall/add、dream），
#   宿主面注册到 tools；会话内是否出现由预设树决定——各预设把该行挂进自己的
#   plugins 树（本容器行只保证组件存在，不直接投放进任何预设）
# 本容器不 retarget 任何官方行。
- insert:
    - id: memory-api
      name: '@dsh/api-memory-recall'
    - id: memory-mount
      name: '@dsh/memory-mount'
    - id: ui-memory-recall
      name: '@dsh/ui-memory-recall'
    - id: memory-recall-tools
      name: '@dsh/memory-recall-tools'
