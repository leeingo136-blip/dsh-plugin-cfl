# 图书馆容器：三个全新组件行，无条件插入。
# - library-api：宿主服务（sqlite-vec 本地向量知识库）与 library 远程面
# - library-mount：client 面独立挂载组件（只挂 library 远程贡献，inject ['remote']；
#   与官方 account-hub-mount 同构——挂载与消费分离，消费方注入 remote.library 命名空间
#   服务以 park 到挂载完成）
# - ui-library：设置中新增「图书馆」一栏（settings.section 槽位）
# 本容器不 retarget 任何官方行。
- insert:
    - id: library-api
      name: '@dsh/api-library'
    - id: library-mount
      name: '@dsh/library-mount'
    - id: ui-library
      name: '@dsh/ui-library'
