# RAG 知识库容器：三个安装级组件行，无条件插入。
#
# 本容器不提供任何 agent 预设。启用方式：在使用者自己的预设树里声明
# rag-knowledge-tools 一行（一个 knowledge 方案参数）；这里只负责让组件存在。
# - rag-knowledge-api：宿主服务（RAG 连接卡片注册表）与 rag-knowledge 远程面
# - rag-knowledge-mount：client 面独立挂载组件（只挂 rag-knowledge 远程贡献，inject ['remote']；
#   与官方 account-hub-mount 同构——挂载与消费分离，消费方注入 remote.rag-knowledge 命名空间
#   服务以 park 到挂载完成）
# - ui-rag-knowledge：设置中新增「记忆回想」一栏（settings.section 槽位；卡片管理，本改动未改名）
# - rag-knowledge-tools（不在此插入）：三个 knowledge 工具 + 随激活出现的技能，
#   由使用者在自己的预设树里声明，参数只有一个：
#     knowledge: <方案名> → knowledge_add / knowledge_search / knowledge_delete + rag-knowledge 技能
#   留空即整组关闭（工具不注册、技能也不出现）。
# 本容器不 retarget 任何官方行。

- insert:
    - id: rag-knowledge-api
      name: '@dsh/api-rag-knowledge'
    - id: rag-knowledge-mount
      name: '@dsh/rag-knowledge-mount'
    - id: ui-rag-knowledge
      name: '@dsh/ui-rag-knowledge'
